name: Compilar APK Android Nativo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar o Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar o Gradle Estável (Compatível com KSP)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-disabled: true

      - name: 4. Gerar o APK de Teste (Debug)
        run: gradle assembleDebug --no-daemon

      - name: 5. Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Calculadora-Omni-APK
          path: "**/build/outputs/apk/debug/*.apk"
